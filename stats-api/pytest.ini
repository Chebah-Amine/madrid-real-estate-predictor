[pytest]
# Dossiers contenant les tests
testpaths = app/test

# Pattern de découverte des fichiers de tests
python_files = test_*.py

# Pattern de découverte des classes de tests
python_classes = Test*

# Pattern de découverte des fonctions de tests
python_functions = test_*

# Options par défaut pour pytest
addopts = 
    -v                          # Verbeux
    --strict-markers            # Erreur si marker inconnu
    --tb=short                  # Traceback court
    --disable-warnings          # Désactiver les warnings Python
    -p no:cacheprovider         # Désactiver le cache

# Markers personnalisés
markers =
    slow: marque les tests lents qui prennent du temps
    integration: tests intégration nécessitant des ressources externes
    unit: tests unitaires rapides

# Variables d'environnement pour les tests
env =
    FLASK_ENV=testing
    MONGODB_DATABASE=sales_test
    MONGODB_COLLECTION=sales_madrid_test